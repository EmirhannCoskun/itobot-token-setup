<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>İTOBOT | Kurulum Tamamlandı</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/success.css') }}"
    />
  </head>

  <body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="page">
      <section class="setup-card">
        <!-- BRAND -->

        <div class="brand">
          <div class="brand-logo">
            <span>ITO</span>
            <span>BOT</span>
          </div>

          <div class="brand-text">
            <span class="brand-name">İTOBOT</span>

            <span class="brand-subtitle"> GRANT TRACKER </span>
          </div>
        </div>

        <div class="divider"></div>

        <!-- SUCCESS CONTENT -->

        <div class="success-content">
          <!-- SUCCESS ICON -->

          <div class="success-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="m5 12 4 4L19 6"></path>
            </svg>
          </div>

          <!-- BADGE -->

          <div class="badge success-badge">
            <span class="badge-dot"></span>

            Kurulum Tamamlandı
          </div>

          <!-- TITLE -->

          <h1>
            İTOBOT
            <span>hazır.</span>
          </h1>

          <!-- DESCRIPTION -->

          <p class="description">
            Telegram botunuz başarıyla yapılandırıldı. Artık İTOBOT'u kullanmaya
            başlayabilirsiniz.
          </p>

          <!-- STATUS -->

          <div class="status-box">
            <!-- TELEGRAM STATUS -->

            <div class="status-row">
              <div class="status-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M20 6 9 17l-5-5"></path>
                </svg>
              </div>

              <div>
                <strong> Telegram bağlantısı </strong>

                <span> Başarıyla doğrulandı </span>
              </div>
            </div>

            <!-- SECURITY STATUS -->

            <div class="status-row">
              <div class="status-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    d="M12 3 4.5 6v5.5
                                       c0 4.4 3.1 8.4 7.5 9.5
                                       4.4-1.1 7.5-5.1 7.5-9.5V6L12 3Z"
                  ></path>
                </svg>
              </div>

              <div>
                <strong> Token güvenliği </strong>

                <span> Local olarak saklanıyor </span>
              </div>
            </div>
          </div>

          <!-- CHANGE TOKEN -->

          <button type="button" id="changeTokenButton" class="secondary-button">
            <span> Tokenı Değiştir </span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M12 20h9"></path>

              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
            </svg>
          </button>

          <!-- DELETE TOKEN -->

          <button type="button" id="deleteTokenButton" class="danger-button">
            <span> Tokenı Sil </span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 15H6L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>

          <!-- MESSAGE -->

          <div id="changeMessage" class="message" aria-live="polite"></div>
        </div>

        <!-- FOOTER -->

        <div class="footer">
          <div class="security">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                d="M12 3 4.5 6v5.5
                               c0 4.4 3.1 8.4 7.5 9.5
                               4.4-1.1 7.5-5.1 7.5-9.5V6L12 3Z"
              ></path>

              <path d="m9 12 2 2 4-4"></path>
            </svg>

            <span> Tokenınız local olarak korunur </span>
          </div>

          <span class="version"> İTOBOT Grant Tracker </span>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/success.js') }}"></script>
  </body>
</html>
